<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon 2D Játék</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/entitas.css" />
    <link rel="stylesheet" href="css/joystick.css" />
    <script type="module" src="js/index.js"></script>
  </head>
  <body>
    <header id="info-panel">
      <div class="stat-box">
        <span>Játékos: </span><span id="player-name">Betöltés...</span>
      </div>
      <div class="stat-box">
        <span>Pontszám: </span><span id="player-score">0</span>
      </div>
      <div class="elet-kontener">
        <span class="elet-label">ÉLET:</span>
        <div class="elet-bar-vaz">
          <div id="elet-bar" style="width: 100%"></div>
        </div>
      </div>
      <div class="controls">
        <span>Joystick</span>
        <label class="switch">
          <input type="checkbox" id="joy-toggle" />
          <span class="slider round"></span>
        </label>
      </div>
    </header>
    <main id="jatekter-container">
      <section id="jatekter"></section>
      <div id="joystick-base" class="hidden">
        <div id="joystick-stick"></div>
      </div>
    </main>
  </body>
</html>
